# Job requisitions.
#
# The case brief asks for search "based on job requisitions", so a requisition
# is a first-class object here rather than a set of dropdowns a user happens
# to tick. All four requisitions below are transcribed from real postings --
# three Millennium (REQ numbers retained) and one Point72 -- not written to
# fit the candidate pool, which is what makes them usable as an external
# check on the matcher: a requisition invented alongside the scoring logic
# can only confirm itself. An earlier revision carried constructed examples;
# they were removed once real postings were available.
#
# The distinction that makes the matcher trustworthy runs through every entry:
#
#   hard  Constraints that DISQUALIFY. A candidate outside the region or the
#         experience band is not a weaker match, they are not a match. Scoring
#         them 72% and leaving them in the list is how ranking tools mislead.
#   soft  Signals that RANK the candidates who already qualify.
#
# Collapsing both into one number is the reason most match scores cannot be
# trusted; keeping them apart is what lets this system say "no one matches".

requisitions:

  # ------------------------------------------------------------------------
  # Point72, Equity Analyst - US Healthcare Therapeutics. Fundamental
  # Equities business; New York / Stamford / San Francisco / West Palm
  # Beach. "1+ years of experience in equity research, investment banking,
  # hedge fund, investment management, private equity or another relevant
  # industry role" -- an open-ended band, encoded as min-only.
  # ------------------------------------------------------------------------
  - id: p72_us_healthcare_therapeutics
    title: Equity Analyst - US Healthcare Therapeutics
    team: Point72 Fundamental Equities · New York
    source: Point72 posting (real)
    summary: >-
      Fundamental equity analyst covering US healthcare therapeutics within
      Point72's Fundamental Equities business. Financial models, forecasts
      and valuation of public companies, fundamental research on companies
      and subsectors, actionable recommendations presented directly to the
      PM, conferences and sell-side relationships.
    hard:
      regions: [US]
      approach_families: [fundamental]
      sectors_any: [healthcare]
      investment_years: {min: 1}
    soft:
      sectors: {healthcare: 1.0}
      firm_types:
        pod_shop: 1.0
        multi_strategy_platform: 1.0
        hedge_fund: 0.9
        crossover: 0.8
        long_only: 0.7
        investment_bank: 0.6
        sell_side: 0.6
      requirements:
        - build and refine financial models, forecasts and valuation analyses
        - fundamental research on companies, industries and subsectors
        - develop and present actionable investment recommendations to the PM
        - attend conferences and build sell-side relationships
        - incorporate macroeconomic and industry developments into research
      credentials_preferred: []
      software_preferred: [Bloomberg, Excel, FactSet]
      methods_preferred: [financial modeling, valuation, forecasting,
                          fundamental research]
      prefer_platform_alum: true
      prefer_buy_side: true

  # ------------------------------------------------------------------------
  # Millennium REQ-27950, US Healthcare Origination Associate, New York.
  # A corporate-access seat, not an investing seat: the posting names no
  # investment approach and no years band, so this requisition carries
  # neither -- eligibility is region and sector knowledge, and the ranking
  # leans on the requirement text.
  # ------------------------------------------------------------------------
  - id: mlm_us_healthcare_origination
    title: US Healthcare Origination Associate
    team: New York · REQ-27950
    source: Millennium posting (real)
    summary: >-
      Corporate access and corporate engagement for US healthcare, including
      SMID therapeutics: building relationships with company management,
      originating and coordinating meetings, running expert calls across
      therapeutic areas, and producing healthcare content from filings,
      transcripts and sell-side research. Prior exposure to equity research,
      specialist sales, investment banking or investor relations is a plus;
      life-sciences background preferred.
    hard:
      regions: [US]
      sectors_any: [healthcare]
    soft:
      sectors: {healthcare: 1.0}
      firm_types:
        sell_side: 1.0
        investment_bank: 0.9
        multi_strategy_platform: 0.9
        pod_shop: 0.8
        hedge_fund: 0.7
        long_only: 0.6
      requirements:
        - build relationships with company management teams and coordinate meetings
        - corporate access, non-deal roadshows and conference participation
        - run expert calls across therapeutic areas
        - produce content from public filings, transcripts and sell-side research
        - detailed meeting notes and summaries for originated meetings
      credentials_preferred: []
      software_preferred: [Bloomberg, Excel]
      methods_preferred: [primary research, expert calls, corporate access]
      prefer_platform_alum: true
      prefer_buy_side: false

  # ------------------------------------------------------------------------
  # Millennium REQ-25042, Research Analyst Healthcare, Mumbai -- supporting
  # a European Healthcare fundamental equity team from the Mumbai office.
  # "4-5 years' experience ideally from sellside or buyside equity
  # research"; healthcare knowledge is "preferred but not mandatory", so
  # sector is deliberately NOT a hard constraint here -- transcribed as
  # posted, not as convenient.
  # ------------------------------------------------------------------------
  - id: mlm_mumbai_healthcare_research
    title: Research Analyst, Healthcare (Mumbai)
    team: Mumbai · REQ-25042
    source: Millennium posting (real)
    summary: >-
      Research analyst on a fundamental equity team covering European
      healthcare, based in Mumbai. Forward-looking financial models kept
      accurate to quarterly results and company commentary, automated
      monitoring of estimates against actuals, and support for idea
      generation with a Senior PM, building toward independent coverage.
    hard:
      regions: [APAC]
      approach_families: [fundamental]
      investment_years: {min: 4, max: 5}
    soft:
      sectors: {healthcare: 1.0, generalist: 0.5}
      firm_types:
        sell_side: 1.0
        investment_bank: 0.8
        pod_shop: 1.0
        multi_strategy_platform: 1.0
        hedge_fund: 0.9
        long_only: 0.8
      requirements:
        - develop, refine and maintain forward-looking financial models
        - reflect quarterly results, company commentary and market trends in models
        - monitor and flag deviations in estimates versus actual performance
        - fundamental research and idea generation with a senior portfolio manager
        - prepare for company management meetings
      credentials_preferred: [CFA]
      software_preferred: [Bloomberg, Visible Alpha, Canalyst, Daloopa, Excel]
      methods_preferred: [financial modeling, forecasting, valuation,
                          fundamental research]
      prefer_platform_alum: true
      prefer_buy_side: false

  # ------------------------------------------------------------------------
  # Millennium REQ-29449, Quantitative Analyst, Quantitative Strategies,
  # New York. A junior systematic-equity seat: sector-specific signals,
  # company-level KPIs, alternative data, backtesting.
  # ------------------------------------------------------------------------
  - id: us_quant_analyst_strategies
    title: Quantitative Analyst, Quantitative Strategies
    team: New York · REQ-29449
    source: Millennium posting (real)
    summary: >-
      Quantitative analyst on a small systematic equity team, focused on
      sector-specific signals, company-level KPIs and custom dataset
      development. Direct exposure to the SPM across idea generation, data
      work, signal research, model implementation and backtesting.
    hard:
      regions: [US]
      approach_families: [systematic_quant]
      # "1-3 years of experience in data science, data analytics,
      # quantitative research, or a related role." The posting files this
      # under "Preferred Experience", but the band defines the seat's
      # seniority: a ten-year researcher is not a weaker fit for a 1-3 year
      # seat, they are a different hire. Encoded hard; the near-miss list
      # keeps anyone it excludes visible.
      investment_years: {min: 1, max: 3}
    soft:
      # "Experience with sector-specific equity research, particularly in
      # industrials, commodities, healthcare, or financials."
      sectors: {industrials: 1.0, energy: 0.9, healthcare: 0.9,
                financials: 0.9, generalist: 0.6, technology: 0.5}
      firm_types:
        pod_shop: 1.0
        multi_strategy_platform: 1.0
        hedge_fund: 0.9
        sell_side: 0.7
        investment_bank: 0.7
        long_only: 0.7
      requirements:
        - alpha research for systematic equity strategies with sector-specific signals
        - company-level KPIs and custom dataset development
        - collect and analyse structured and unstructured alternative datasets
        - research, implementation and backtesting of signals
        - apply statistical techniques to turn raw data into investable insights
        - use LLMs or modern machine learning tools in research workflows
      credentials_preferred: []
      software_preferred: [Python]
      methods_preferred: [backtesting, machine learning, statistical analysis,
                          alternative data, signal construction]
      prefer_platform_alum: true
      prefer_buy_side: false



# Relative weights of the soft components. Exposed here so the ranking can be
# argued about and adjusted without touching the matching code.
soft_weights:
  sector_fit: 0.25
  requirement_fit: 0.25
  skills_fit: 0.15
  firm_type_fit: 0.12
  coverage_depth: 0.08
  credentials: 0.07
  platform_alum: 0.04
  buy_side: 0.04


# Concept map used by the requirement matcher.
#
# Lexical similarity alone misses the paraphrases this domain runs on: a
# requisition says "catalysts" where a resume says "earnings events", and
# "coverage list" where a resume says "stocks under coverage". Neural sentence
# embeddings would absorb that automatically.
#
# They are not used here, for two reasons. The practical one is that this
# environment cannot reach the model host. The design one is that at ~200
# candidate sentences a curated concept map performs comparably, adds no
# 500MB dependency to a free-tier deployment, and is auditable: a bad match is
# fixed by editing a line below rather than by hoping a model behaves
# differently. Embeddings earn their place when the corpus outgrows curation,
# which for this kind of vocabulary is in the low tens of thousands of
# documents -- see `match.py` for the pluggable backend.
concept_map:
  catalyst: [earnings event, earnings, catalyst, event driven, quarterly results,
             pre-announcement, guidance]
  coverage: [under coverage, coverage list, names covered, stocks under coverage,
             initiated on, active coverage, covering]
  valuation: [dcf, discounted cash flow, sum-of-the-parts, comparable company,
              price target, valuation, multiples]
  primary_research: [management meetings, expert network, channel checks,
                     industry experts, corporate access, company management,
                     investor day, roadshow]
  long_short: [long/short, long short, l/s, hedging, position sizing, shorting]
  backtesting: [backtest, backtesting, historical simulation, out-of-sample,
                performance attribution, sharpe]
  factor_model: [multi-factor, factor model, alpha model, signal, systematic
                 strategy, quantitative model]
  programming: [python, c++, c#, java, sql, r, kdb, matlab]
  private_markets: [series b, growth equity, venture, private, board observer,
                    portfolio company, co-led, financing round]
  publishing: [initiation report, research report, thematic report, published,
               ratings, sector outlook, earnings report, written reports]
  macro: [macroeconomic, macro, industry dynamics, regulatory, sector rotation,
          policy, sectoral themes, market trends, industry trends]
  financial_model: [financial model, financial models, financial modeling,
                    financial modelling, earnings model, build models,
                    comparable company, dcf, valuation analysis]
  idea_generation: [idea generation, investment ideas, source ideas,
                    investment recommendations, recommendations, stock picks,
                    initiate coverage, generate ideas]
  alternative_data: [alternative data, alt data, web traffic, satellite,
                     custom datasets, unstructured data, kpi, kpis,
                     data scraping, scraped]
  machine_learning: [machine learning, ml, llm, llms, statistical learning,
                     deep learning, scikit-learn, nlp, neural network]
  derivatives: [options, swaps, forwards, futures, volatility, tail hedging,
                cross-asset, derivatives]
  research_infra: [data pipeline, data pipelines, research infrastructure,
                   etl, reproducible research, production code, backtesting
                   tools]
