# Human triage of individual flags.
#
# The model reports everything it notices; a reviewer then decides what is
# actually a problem. That decision is knowledge, so it lives here rather
# than in a deleted flag: each entry marks one specific flag benign, with
# the reviewer's reasoning attached. At enrichment the matching flag is
# downgraded to severity "info" -- still visible in the record, shown as a
# note, excluded from the confidence penalty. Nothing is ever deleted,
# because a triage decision should itself be auditable and reversible.
#
# match is a case-insensitive substring of the flag's summary.
#
# MAINTENANCE: model flag WORDING drifts on every re-parse (the finding
# stays, the sentence changes), so after a schema change re-check these
# matches -- an entry that no longer matches silently stops applying.
# The long-term fix is matching on a stable flag fingerprint; noted in
# the roadmap.

reviewed_benign:
  - candidate: chen-li-alex
    match: "Investment Intern position firm"
    note: >-
      Internship attribution ambiguity; internships carry no weight in any
      tenure figure, so nothing downstream depends on the answer.
  - candidate: marina-silva-costa
    match: "MBA summer internship"
    note: >-
      A summer internship inside an MBA program is the expected pattern,
      not an anomaly -- the flag's own text says as much.
  - candidate: marina-silva-costa
    match: "thousands separator"
    note: >-
      Non-US number formatting from a non-US candidate. Formatting
      conventions track region, not quality; penalising them would encode
      a regional bias.
  - candidate: chen-li-alex
    match: "Email uses unconventional capitalization"
    note: >-
      Capitalisation in an email address is cosmetic; addresses are
      case-insensitive in practice and nothing else is inconsistent.
  - candidate: marcus-chen-rodriguez
    match: "Student activities embedded in education section"
    note: >-
      A common resume layout choice, not an inconsistency; the activities
      are correctly excluded from tenure either way.
